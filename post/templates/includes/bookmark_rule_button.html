<button
    class="bookmark-rule-btn{% if rule.is_bookmarked %} is-bookmarked{% endif %}"
    type="button"
    title="{% if rule.is_bookmarked %}Edit bookmark{% else %}Bookmark this rule{% endif %}"
    aria-label="{% if rule.is_bookmarked %}Edit bookmark for{% else %}Bookmark{% endif %} rule {{ rule.section }}"
    data-section="{{ rule.section }}"
    data-rule-type="{{ rule_type }}"
    data-bookmarked="{{ rule.is_bookmarked|yesno:'true,false' }}"
    data-bookmark-note="{{ rule.bookmark_note|escape }}"
>{% if rule.is_bookmarked %}★{% else %}☆{% endif %}</button>

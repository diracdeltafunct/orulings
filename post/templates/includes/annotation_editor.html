<script>
  const quillEditors = {};

  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".edit-content-btn").forEach((button) => {
      button.addEventListener("click", function () {
        const section = this.dataset.section;
        const editKind = this.dataset.editKind;
        const editorContainer = document.getElementById("editor-container-" + section);
        editorContainer.style.display = "block";
        editorContainer.dataset.editKind = editKind;

        if (!quillEditors[section]) {
          quillEditors[section] = new Quill(document.getElementById("editor-" + section), {
            theme: "snow",
            modules: {
              toolbar: [
                ["bold", "italic", "underline", "strike"],
                ["blockquote", "code-block"],
                [{ list: "ordered" }, { list: "bullet" }],
                [{ header: [1, 2, 3, false] }],
                ["link"],
                ["clean"],
              ],
            },
          });
        }

        const editor = quillEditors[section];
        editor.root.dataset.placeholder = editKind === "personal-note"
          ? "Add your private personal note here..."
          : "Add a shared annotation here...";
        editor.root.innerHTML = editKind === "personal-note"
          ? editorContainer.dataset.personalNote
          : editorContainer.dataset.annotation;
      });
    });

    document.querySelectorAll(".cancel-annotation-btn").forEach((button) => {
      button.addEventListener("click", function () {
        document.getElementById("editor-container-" + this.dataset.section).style.display = "none";
      });
    });

    document.querySelectorAll(".save-annotation-btn").forEach((button) => {
      button.addEventListener("click", function () {
        const section = this.dataset.section;
        const ruleType = this.dataset.ruleType || "TR";
        const editorContainer = document.getElementById("editor-container-" + section);
        const editor = quillEditors[section];
        if (!editor) return;

        const content = editor.root.innerHTML;
        const finalContent = editor.getText().trim().length > 0 ? content : "";
        const isPersonalNote = editorContainer.dataset.editKind === "personal-note";
        const endpoint = isPersonalNote ? "/api/save-personal-note/" : "/api/save-annotation/";
        const payload = { rule_type: ruleType, section: section };
        payload[isPersonalNote ? "note" : "annotation"] = finalContent;

        fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken"),
          },
          body: JSON.stringify(payload),
        })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
          if (!ok || !data.success) throw new Error(data.error || "Failed to save");
          location.reload();
        })
        .catch(error => alert("Error: " + error.message));
      });
    });

    function getCookie(name) {
      const cookies = document.cookie ? document.cookie.split(";") : [];
      for (const rawCookie of cookies) {
        const cookie = rawCookie.trim();
        if (cookie.startsWith(name + "=")) {
          return decodeURIComponent(cookie.substring(name.length + 1));
        }
      }
      return null;
    }
  });
</script>
